<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Background Gradient -->
<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#0D1117"/>
<stop offset="100%" stop-color="#161B22"/>
</linearGradient>

<!-- Card Gradient -->
<linearGradient id="card" x1="0" y1="0" x2="0" y2="420">
<stop offset="0%" stop-color="#1C2128"/>
<stop offset="100%" stop-color="#161B22"/>
</linearGradient>

<!-- Orange Glow -->
<linearGradient id="accent" x1="0" y1="0" x2="0" y2="300">
<stop offset="0%" stop-color="#F59E0B"/>
<stop offset="100%" stop-color="#FBBF24"/>
</linearGradient>

<!-- Glass Highlight -->
<linearGradient id="glass" x1="0" y1="0" x2="1280" y2="0">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>

<!-- Shadow -->
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="16" stdDeviation="22"
flood-color="#000000"
flood-opacity="0.45"/>
</filter>

<!-- Soft Glow -->
<filter id="glow">
<feGaussianBlur stdDeviation="18"/>
</filter>

</defs>

<!-- Background -->
<rect width="1280" height="420" rx="28" fill="url(#bg)"/>

<!-- Main Card -->
<rect
x="20"
y="20"
width="1240"
height="380"
rx="24"
fill="url(#card)"
stroke="#30363D"
