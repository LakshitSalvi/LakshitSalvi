<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0D1117"/>
<stop offset="100%" stop-color="#161B22"/>
</linearGradient>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.title{fill:#F8FAFC;font-size:38px;font-weight:700}
.head{fill:#F59E0B;font-size:18px;font-weight:700}
.body{fill:#D1D5DB;font-size:17px}
.card{fill:#161B22;stroke:#30363D}
</style>
</defs>

<rect width="1280" height="700" rx="28" fill="url(#bg)"/>
<rect x="20" y="20" width="1240" height="660" rx="24" fill="#1B2129" stroke="#30363D"/>

<text x="60" y="82" class="t title">CASE STUDIES</text>
<line x1="60" y1="102" x2="1220" y2="102" stroke="#30363D"/>


<rect x="60" y="140" width="560" height="200" rx="18" class="card"/>
<text x="84" y="178" class="t head">RETAIL ANALYTICS</text>
<text x="84" y="222" class="t body">• Sales performance</text>
<text x="84" y="252" class="t body">• Customer segmentation</text>
<text x="84" y="282" class="t body">• Inventory optimization</text>

<rect x="660" y="140" width="560" height="200" rx="18" class="card"/>
<text x="684" y="178" class="t head">BANKING ANALYTICS</text>
<text x="684" y="222" class="t body">• Fraud detection</text>
<text x="684" y="252" class="t body">• Customer churn</text>
<text x="684" y="282" class="t body">• Executive KPI dashboards</text>

<rect x="60" y="380" width="560" height="200" rx="18" class="card"/>
<text x="84" y="418" class="t head">HEALTHCARE ANALYTICS</text>
<text x="84" y="462" class="t body">• Patient insights</text>
<text x="84" y="492" class="t body">• Hospital operations</text>
