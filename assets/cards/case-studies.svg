<text x="684" y="522" class="t body">• Warehouse analytics</text>

<rect x="440" y="610" width="400" height="42" rx="21" fill="#222B35" stroke="#30363D"/>
<text x="640" y="637" text-anchor="middle" class="t body">More case studies coming as the portfolio grows.</text>
</svg>
